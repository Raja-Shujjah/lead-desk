name: Keep Supabase Alive
   on:
     schedule:
       - cron: "0 8 */3 * *"   # every 3 days
     workflow_dispatch:
   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - name: Ping
           run: |
             curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/company_settings?select=id" \
               -H "apikey: ${{ secrets.SUPABASE_ANON }}" -o /dev/null
